{% extends 'fixtures/base.html' %}

{% block gameblock %}
{% for game in data %}
<div class="gameblock" onclick="window.open('livegame?id={{game.id}}')">
    <!--Gameblock Header-->
    <div class="gameblock-heading text-center">
        <div class="gameblock-title">
            <h3>{{game.teamA}}</h3>
        </div>
        <div class="gameblock-divider">
            vs
        </div>
        <div class="gameblock-title">
            <h3>{{game.teamB}}</h3>
        </div>
    </div>
    <!--Gameblock Body-->
    <div class="gameblock-body">
        <img class="gameblock-teamlogo" src="/static/images/logos/{{game.teamA_image}}"> 
        <img class="gameblock-teamlogo" src="/static/images/logos/{{game.teamB_image}}" style="float: right;">

        <!--Game Status-->
        <div class="gameblock-status">
            {{game.status}}
        </div>
    </div>

    <!--Gameblock Footer-->
    <div class="gameblock-footer">
        <span><i class="fa-solid fa-calendar-days"></i> {{game.datetime}}</span>
        <br>
        <span><i class="fa-sharp fa-solid fa-location-dot"></i> {{game.venue}}</span>
        <span><b>Type: </b>{{game.format}}</span>
        <span><b>Toss: </b>{{game.toss}}</span>
    </div>
</div>
{% endfor %} 
{% endblock %}
